<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIS-TRIAGEM — QR Code de Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy-950: #071726;
      --navy-900: #0c2337;
      --navy-800: #123449;
      --teal: #067a8f;
      --teal-strong: #045b6b;
      --teal-glow: #22d3c5;
      --teal-bg: #e3f6f4;
      --surface: #ffffff;
      --ink: #0e2436;
      --ink-soft: #4c6478;
      --ink-faint: #93a5b4;
      --line: #dde5ec;
      --f-display: 'Space Grotesk', 'Inter', sans-serif;
      --f-body: 'Inter', -apple-system, sans-serif;
    }

    html { -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--f-body);
      min-height: 100vh;
      background: linear-gradient(150deg, var(--navy-950) 0%, var(--navy-900) 50%, var(--navy-800) 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(34,211,197,.08) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(6,122,143,.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(34,211,197,0.05);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-glow) 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(34,211,197,0.25);
    }

    .logo-icon svg {
      width: 26px;
      height: 26px;
    }

    .logo-text {
      font-family: var(--f-display);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      background: linear-gradient(90deg, #fff 30%, var(--teal-glow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--ink-faint);
      font-size: 0.9rem;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .qr-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 28px;
    }

    .qr-glow {
      position: absolute;
      inset: -12px;
      background: radial-gradient(circle, rgba(34,211,197,0.15) 0%, transparent 70%);
      border-radius: 20px;
      z-index: 0;
    }

    .qr-box {
      position: relative;
      z-index: 1;
      background: var(--surface);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      border: 1px solid rgba(34,211,197,0.12);
    }

    .qr-box img {
      display: block;
      width: 220px;
      height: 220px;
      border-radius: 8px;
    }

    .url-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34,211,197,0.08);
      border: 1px solid rgba(34,211,197,0.15);
      border-radius: 10px;
      padding: 10px 18px;
      margin-bottom: 28px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--teal-glow);
      word-break: break-all;
    }

    .url-badge svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .steps {
      text-align: left;
      margin-bottom: 32px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
    }

    .step + .step {
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .step-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-glow) 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--navy-950);
    }

    .step-text {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.5;
      padding-top: 3px;
    }

    .step-text strong {
      color: #fff;
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-glow) 100%);
      color: var(--navy-950);
      text-decoration: none;
      border-radius: 12px;
      font-family: var(--f-display);
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(34,211,197,0.25);
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(34,211,197,0.35);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      .logo-text { font-size: 1.25rem; }
      .qr-box img { width: 190px; height: 190px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#071726" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12h4l1.6-4.5L11 17l2.4-8.5L15 12h7"/>
        </svg>
      </div>
      <div class="logo-text"><span>SIS-TRIAGEM</span></div>
    </div>

    <p class="subtitle">Escaneie o QR Code para acessar o sistema no celular</p>

    <div class="qr-wrapper">
      <div class="qr-glow"></div>
      <div class="qr-box">
        <img src="/api/qrcode" alt="QR Code de acesso ao SIS-TRIAGEM">
      </div>
    </div>

    <div class="url-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
       <span id="url-display">Acesse via QR Code</span>
    </div>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text">Abra a <strong>câmera</strong> do seu celular</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text">Aponte para o <strong>QR Code</strong></div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text">Toque no <strong>link</strong> que aparecer</div>
      </div>
    </div>

    <a href="/" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Voltar ao Sistema
    </a>

    <p class="footer-note">SIS-TRIAGEM — Classificação de Risco Médico com IA</p>
  </div>

  <script>
    document.getElementById('url-display').textContent = window.location.origin || 'Acesse via QR Code';
  </script>
</body>
</html>
